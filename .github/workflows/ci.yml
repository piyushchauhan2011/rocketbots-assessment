name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck checked JavaScript
        run: pnpm exec turbo run typecheck --ui=stream
      - name: Unit and integration coverage
        run: pnpm exec turbo run test:unit:coverage --ui=stream
      - name: Publish Core coverage report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Core
          json-summary-path: packages/core/coverage/coverage-summary.json
          json-final-path: packages/core/coverage/coverage-final.json
          file-coverage-mode: all
          sort-by: lines-asc
      - name: Publish Web coverage report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: Web
          json-summary-path: apps/web/coverage/coverage-summary.json
          json-final-path: apps/web/coverage/coverage-final.json
          file-coverage-mode: all
          sort-by: lines-asc
      - name: Build web and Storybook
        run: pnpm exec turbo run build --filter=@rocketbots/web --filter=@rocketbots/storybook --ui=stream
      - name: Publish bundle budget report
        if: always() && github.event_name == 'pull_request' && hashFiles('apps/web/bundle-budget-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bundle-budget-report
          path: apps/web/bundle-budget-report.md
      - name: Install Playwright Chromium
        run: pnpm --filter @rocketbots/e2e exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm exec turbo run test:e2e --filter=@rocketbots/e2e --ui=stream
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/core/coverage
            apps/web/coverage
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: apps/e2e/cucumber-report.html
      - name: Upload Storybook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: apps/storybook/storybook-static

  duplication:
    name: Duplication report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Analyze source duplication
        id: jscpd
        uses: kucherenko/jscpd@v5
        with:
          path: apps/web/src,packages/core/src,packages/ui/src
          min-tokens: 50
          min-lines: 5
          reporters: console,json,html
          output: jscpd-report
          upload-report: true
          upload-sarif: false
      - name: Publish duplication report
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: duplication-report
          message: |
            ## Duplication report

            | Metric | Result |
            | --- | ---: |
            | Duplicated code | ${{ steps.jscpd.outputs.duplication-percentage }}% |
            | Clone pairs | ${{ steps.jscpd.outputs.clones-found }} |
            | Duplicated lines | ${{ steps.jscpd.outputs.duplicated-lines }} / ${{ steps.jscpd.outputs.total-lines }} |
            | Source files scanned | ${{ steps.jscpd.outputs.files-count }} |

            Generated by `jscpd`. This report is informational and does not block merging.
            [Open the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
