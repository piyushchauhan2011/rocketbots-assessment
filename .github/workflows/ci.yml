name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Unit and integration coverage
        run: pnpm test:unit:coverage
      - name: Publish coverage report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          file-coverage-mode: all
          sort-by: lines-asc
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  duplication:
    name: Duplication report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Analyze source duplication
        id: jscpd
        uses: kucherenko/jscpd@v5
        with:
          path: src
          min-tokens: 50
          min-lines: 5
          reporters: console,json,html
          output: jscpd-report
          upload-report: true
          upload-sarif: false
      - name: Publish duplication report
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: duplication-report
          message: |
            ## Duplication report

            | Metric | Result |
            | --- | ---: |
            | Duplicated code | ${{ steps.jscpd.outputs.duplication-percentage }}% |
            | Clone pairs | ${{ steps.jscpd.outputs.clones-found }} |
            | Duplicated lines | ${{ steps.jscpd.outputs.duplicated-lines }} / ${{ steps.jscpd.outputs.total-lines }} |
            | Source files scanned | ${{ steps.jscpd.outputs.files-count }} |

            Generated by `jscpd`. This report is informational and does not block merging.
            [Open the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
