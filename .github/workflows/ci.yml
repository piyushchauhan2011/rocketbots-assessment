name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
jobs:
  conventional-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate squash commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm commitlint
      - name: Validate changesets
        # Version PRs consume their changesets. Dependabot does not add one,
        # and dependency bumps merge without a release note.
        if: >-
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          (github.head_ref != 'changeset-release/main' ||
          github.event.pull_request.head.repo.full_name != github.repository)
        run: pnpm changeset status --since origin/main

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck checked JavaScript
        run: pnpm typecheck
      - name: Generate API documentation
        run: pnpm docs:build
      - name: Build Storybook
        run: pnpm storybook:build
      - name: Unit and integration coverage
        run: pnpm test:unit:coverage
      - name: Publish coverage report
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          file-coverage-mode: all
          sort-by: lines-asc
      - name: Build and enforce bundle budgets
        run: pnpm build
      - name: Publish bundle budget report
        if: always() && github.event_name == 'pull_request' && hashFiles('bundle-budget-report.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bundle-budget-report
          path: bundle-budget-report.md
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Set up Java for Allure
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Browser tests
        run: pnpm test:e2e
      - name: Generate Allure report
        if: always() && hashFiles('allure-results/*-result.json') != ''
        run: pnpm report:e2e
      - name: Upload Allure report
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: error
      - name: Upload Allure results
        if: always() && hashFiles('allure-results/*-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: error
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: cucumber-report.html

  duplication:
    name: Duplication report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Analyze source duplication
        id: jscpd
        uses: kucherenko/jscpd@v5
        with:
          path: src
          min-tokens: 50
          min-lines: 5
          reporters: console,json,html
          output: jscpd-report
          upload-report: true
          upload-sarif: false
      - name: Publish duplication report
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: duplication-report
          message: |
            ## Duplication report

            | Metric | Result |
            | --- | ---: |
            | Duplicated code | ${{ steps.jscpd.outputs.duplication-percentage }}% |
            | Clone pairs | ${{ steps.jscpd.outputs.clones-found }} |
            | Duplicated lines | ${{ steps.jscpd.outputs.duplicated-lines }} / ${{ steps.jscpd.outputs.total-lines }} |
            | Source files scanned | ${{ steps.jscpd.outputs.files-count }} |

            Generated by `jscpd`. This report is informational and does not block merging.
            [Open the workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  release:
    name: Version PR or GitHub Release
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require release automation token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Configure RELEASE_TOKEN as documented in docs/development.md."
            exit 1
          fi
      - name: Open or update version PR
        id: changesets
        uses: changesets/action@v2
        with:
          version: pnpm version:release
          title: 'chore(release): version application'
          commit: 'chore(release): version application'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Publish GitHub Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
